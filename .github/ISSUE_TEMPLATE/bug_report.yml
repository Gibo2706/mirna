name: Bug report
description: Report a reproducible Mirna problem using synthetic data.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not include real financial records, exports, credentials or security-vulnerability details.
        Report vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Mirna version
      placeholder: e.g. 2.3.x
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic data
      description: List the smallest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only synthetic data and removed sensitive metadata.
          required: true
